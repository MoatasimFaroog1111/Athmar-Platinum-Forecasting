name: Platinum source acquisition and research
on:
  pull_request:
  workflow_dispatch:
    inputs:
      train_daily:
        description: "Train only if a verified daily CSV is provided"
        type: boolean
        default: false
  schedule:
    - cron: "20 7 * * 1-5"
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Download sources
        if: ${{ github.event_name != 'pull_request' }}
        run: python -m platinum.acquire --out raw/acquired
      - name: Train daily model (requires actual historical prices)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.train_daily }}
        run: python -m platinum.daily --csv data/daily/platinum.csv --instrument "${PLATINUM_INSTRUMENT}"
        env:
          PLATINUM_INSTRUMENT: ${{ vars.PLATINUM_INSTRUMENT }}
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platinum-research-${{ github.run_id }}
          path: |
            raw/acquired/
            outputs/
          retention-days: 7
