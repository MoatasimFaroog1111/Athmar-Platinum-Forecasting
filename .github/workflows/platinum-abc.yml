name: Platinum A-B-C research
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Acquire real platinum futures daily bars for research
        if: github.event_name == 'workflow_dispatch'
        run: python -m platinum.price_source --out raw/daily
      - name: Run A-B-C direct-horizon competition and forecast file
        if: github.event_name == 'workflow_dispatch'
        run: python -m platinum.model_competition --csv raw/daily/platinum_daily_futures.csv --instrument YAHOO_PL_F_FUTURES_INDICATIVE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platinum-abc-${{ github.run_id }}
          path: |
            raw/daily/
            outputs/multihorizon/
          retention-days: 7
