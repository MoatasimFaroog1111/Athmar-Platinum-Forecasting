name: Research daily data and experimental backtest
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  daily-research:
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Attempt real daily chart download (not a licensed benchmark)
        run: python -m platinum.price_source --out raw/daily
      - name: Walk-forward research backtest
        run: python -m platinum.daily --csv raw/daily/platinum_daily_futures.csv --instrument "YAHOO_PL_F_FUTURES_INDICATIVE" --output outputs/daily
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platinum-daily-research-${{ github.run_id }}
          path: |
            raw/daily/
            outputs/daily/
          retention-days: 7
