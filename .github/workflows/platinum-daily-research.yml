name: Research daily data and experimental backtest
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
  daily-research:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Attempt real daily chart download (not a licensed benchmark)
        run: python -m platinum.price_source --out raw/daily
      - name: Retrieve WPIC and CFTC original archives
        run: python -m platinum.acquire --out raw/acquired
      - name: Extract WPIC evidence and CFTC positions into SQLite
        run: python -m platinum.fundamentals --raw raw/acquired --db outputs/research.sqlite --out outputs/extracted
      - name: Walk-forward research backtest
        run: python -m platinum.daily --csv raw/daily/platinum_daily_futures.csv --instrument "YAHOO_PL_F_FUTURES_INDICATIVE" --output outputs/daily
      - name: A-B-C multi-horizon research evaluation
        run: python -m platinum.model_competition --csv raw/daily/platinum_daily_futures.csv --instrument YAHOO_PL_F_FUTURES_INDICATIVE
      - name: Independent pre-holdout multi-fold selection and untouched holdout
        run: python -m platinum.validation --csv raw/daily/platinum_daily_futures.csv --instrument YAHOO_PL_F_FUTURES_INDICATIVE
      - name: Export real CFTC managed-money positioning as conservative research feature
        run: python -m platinum.cftc_research_export --raw raw/acquired --out outputs/features/cftc_managed_money_assumed.csv
      - name: Configure historical source feature mapping
        run: |
          mkdir -p outputs/features
          printf '{"cftc_net_managed_money":"outputs/features/cftc_managed_money_assumed.csv"}\n' > outputs/features/feature_paths.json
      - name: Acquire daily cross-market macro features
        run: python -m platinum.market_features --out outputs/features/market
      - name: Build combined feature map
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=json.loads(Path("outputs/features/market/feature_paths_market.json").read_text())
          paths["cftc_net_managed_money"]="outputs/features/cftc_managed_money_assumed.csv"
          Path("outputs/features/feature_paths_all.json").write_text(json.dumps(paths,indent=2))
          PY
      - name: Compare multi-source candidate models
        run: python -m platinum.multisource --daily raw/daily/platinum_daily_futures.csv --features outputs/features/feature_paths_all.json
      - name: Run pre-approval multi-horizon point and interval gate
        run: python -m platinum.preapproval_gate --daily raw/daily/platinum_daily_futures.csv --features outputs/features/feature_paths_all.json --out outputs/preapproval
      - name: Compare real daily-price-only vs historical CFTC augmented models
        run: python -m platinum.multisource --daily raw/daily/platinum_daily_futures.csv --features outputs/features/feature_paths.json
      - name: Independently assess historical interval coverage
        run: python -m platinum.coverage_audit --csv raw/daily/platinum_daily_futures.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platinum-daily-research-${{ github.run_id }}
          path: |
            raw/daily/
            outputs/daily/
            outputs/multihorizon/
            outputs/extracted/
            outputs/validated/
            outputs/coverage/
            outputs/features/
            outputs/multisource/
            outputs/preapproval/
            outputs/research.sqlite
            raw/acquired/manifest.json
          retention-days: 7
