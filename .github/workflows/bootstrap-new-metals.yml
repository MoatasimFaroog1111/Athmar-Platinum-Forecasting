name: Bootstrap New Metal V1 Locks

on:
  push:
    branches:
      - feat/multi-metal-intelligence
    paths:
      - ".github/workflows/bootstrap-new-metals.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-new-metal-v1-locks
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/multi-metal-intelligence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Bootstrap Gold Silver Palladium V1
        run: python -m metals.bootstrap_v1 --all
      - name: Verify locks are prospective and independent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for metal in ("gold","silver","palladium"):
              lock=json.loads(Path(f"config/{metal}_model_lock_v1.json").read_text())
              protocol=json.loads(Path(f"config/{metal}_prospective_holdout_v1.json").read_text())
              assert lock["metal"] == metal
              assert lock["lock_start"] == protocol["origin_start"] == "2026-11-04"
              assert protocol["score_not_before_utc"] == "2027-12-16T00:00:00Z"
              assert protocol["source_policy"]["official_fundamentals_in_v1"] is False
              assert lock["governance"]["immutable"] is True
              assert set(lock["horizons"]) == {"1","5","20","60","90"}
          print("THREE_INDEPENDENT_PROSPECTIVE_LOCKS_CONFIRMED")
          PY
      - name: Persist immutable V1 snapshots and locks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/gold_* config/silver_* config/palladium_* data/locks/gold data/locks/silver data/locks/palladium
          git commit -m "lock: freeze Gold Silver Palladium prospective V1 systems"
          git fetch origin feat/multi-metal-intelligence
          git rebase origin/feat/multi-metal-intelligence
          git push origin HEAD:feat/multi-metal-intelligence
